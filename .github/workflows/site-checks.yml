name: Site checks

on:
  pull_request:
  push:
    branches: [main, "design/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check pages and Vault interactions
        run: node scripts/verify-site.mjs
      - name: Save page previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-previews
          path: |
            artifacts/
            dist/
          if-no-files-found: ignore
