<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Editor - Epppe's Media Ratings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Epppe's Media Ratings – Admin</h1>
    </header>
    <nav>
      <a href="index.html">Home</a>
      <a href="ratings.html">Ratings</a>
      <a href="edit.html">Edit</a>
      <a href="https://stream.epppe.net" target="_blank">Stream</a>
    </nav>
    <div class="container">
      <h2>Admin Editor</h2>
      <p>This page allows you to manage your ratings. Access is restricted with a password.</p>
      <div id="login-section">
        <label for="admin-pass">Password:</label>
        <input type="password" id="admin-pass" />
        <button id="login-btn" class="btn">Login</button>
        <p id="login-error" style="color: red; display: none;">Incorrect password. Please try again.</p>
      </div>
      <div id="edit-section" style="display: none;">
        <h3>Existing Entries</h3>
        <table id="edit-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Category</th>
              <th>Favorite</th>
              <th>Rating</th>
              <th>Notes</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <h3 id="form-heading">Add Entry</h3>
        <form id="entry-form">
          <input type="hidden" id="entry-id" />
          <label for="title-input">Title</label>
          <input type="text" id="title-input" required />
          <label for="category-input">Category</label>
          <select id="category-input" required>
            <option value="games">Games</option>
            <option value="movies">Movies</option>
            <option value="tv">TV</option>
            <option value="anime">Anime</option>
            <option value="reading">Reading</option>
          </select>
          <label for="rating-input">Rating</label>
          <input type="number" id="rating-input" min="1" max="5" required />
          <label for="favorite-input">Favorite</label>
          <input type="checkbox" id="favorite-input" />
          <label for="notes-input">Notes</label>
          <textarea id="notes-input" rows="3"></textarea>
          <label for="description-input">Description</label>
          <textarea id="description-input" rows="4"></textarea>
          <button type="submit" class="btn" id="save-btn">Save</button>
          <button type="button" class="btn" id="cancel-edit" style="display: none;">Cancel</button>
        </form>
        <button id="download-json" class="btn">Download JSON</button>
      </div>
    </div>
    <script src="edit.js"></script>
  </body>
</html>
