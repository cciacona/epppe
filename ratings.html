<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ratings - Epppe's Media Ratings</title>
    <!-- Preconnect and Google Font import for a modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="nav-container">
        <div class="brand">
          <div class="brand-mark">E</div>
          <div class="brand-title">epppe.net</div>
        </div>
        <nav class="site-nav">
          <a href="index.html">Home</a>
          <a href="ratings.html">Reviews</a>
          <a class="nav-cta" href="https://stream.epppe.net" target="_blank">Stream</a>
        </nav>
      </div>
    </header>
    <main class="container">
      <div class="ratings-header">
        <div>
          <h2 class="ratings-title">Review Log</h2>
          <p>Curated ratings for things I've consumed recently.</p>
        </div>
        <div class="view-toggle" role="group" aria-label="Toggle ratings view">
          <button class="view-button active" type="button" data-view="grid" aria-pressed="true">
            Grid
          </button>
          <button class="view-button" type="button" data-view="spreadsheet" aria-pressed="false">
            Spreadsheet
          </button>
        </div>
      </div>
      <div class="filters">
        <button class="filter-button active" data-category="all">All</button>
        <button class="filter-button" data-category="games">Games</button>
        <button class="filter-button" data-category="movies">Movies</button>
        <button class="filter-button" data-category="tv">TV</button>
        <button class="filter-button" data-category="anime">Anime</button>
        <button class="filter-button" data-category="reading">Reading</button>
      </div>
      <div class="grid-wrapper" id="ratings-grid"></div>
      <div class="table-wrapper" id="ratings-table-wrapper" hidden>
        <table id="ratings-table">
          <thead>
            <tr>
              <th data-key="title">Title</th>
              <th data-key="category">Category</th>
              <th data-key="favorite">Favorite</th>
              <th data-key="rating">Rating</th>
              <th data-key="notes">Notes</th>
              <th data-key="dateAdded">Date Added</th>
            </tr>
          </thead>
          <tbody id="ratings-body"></tbody>
        </table>
      </div>
    </main>
    <div id="detail-modal" class="modal">
      <div class="modal-content"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
